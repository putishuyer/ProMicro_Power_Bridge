name: Build UF2 Firmware

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install West
      run: |
        pip3 install west
        west init -m . --mr main || true
        west update

    - name: Initialize Zephyr toolchain
      run: |
        pip3 install cmake ninja

    - name: Build Firmware
      run: |
        west build -b promicro_nrf52840 -- -DCONF_FILE=prj.conf

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ProMicro_Power_Bridge_UF2
        path: |
          build/zephyr/*.uf2
