name: Build UF2 Firmware

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Setup Zephyr Project and Toolchain
      uses: zephyrproject-rtos/action-zephyr-setup@v1
      with:
        app-path: .
        toolchains: arm-zephyr-eabi

    - name: Build Firmware via West
      run: |
        west build -b promicro_nrf52840 -- -DCONF_FILE=prj.conf

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ProMicro_Power_Bridge_UF2
        path: |
          build/zephyr/*.uf2
