name: Build UF2 Firmware with ANT

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Compatible CMake 3.29.3
      uses: lukka/get-cmake@v3.29.3

    - name: Setup Zephyr Project and Toolchain
      uses: zephyrproject-rtos/action-zephyr-setup@v1
      with:
        app-path: .
        toolchains: arm-zephyr-eabi

    - name: Link Dependencies and Build Firmware
      run: |
        # 1. 显式声明当前的 ZEPHYR_BASE 路径，将外置的扩展依赖包导入变量
        export ZEPHYR_BASE=$GITHUB_WORKSPACE/zephyr
        
        # 2. 调用 west 进行全路径包含的编译，允许未被内核完全识别的高级符号注入
        # 并在构建时允许 Kconfig 警告通过，以便原作者的 ANT 驱动能顺利合入
        export KCONFIG_WARN_AS_ERROR=0
        west build -b promicro_nrf52840 -- -DCONF_FILE=prj.conf -DKCONFIG_WARN_AS_ERROR=0

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ProMicro_Power_Bridge_UF2
        path: |
          build/zephyr/*.uf2
