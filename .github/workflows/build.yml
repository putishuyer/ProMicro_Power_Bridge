name: Build UF2 Firmware with ANT

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Compatible CMake 3.29.3
      uses: lukka/get-cmake@v3.29.3

    - name: Setup Zephyr Project and Toolchain
      uses: zephyrproject-rtos/action-zephyr-setup@v1
      with:
        app-path: .
        toolchains: arm-zephyr-eabi

    - name: Link ANT Module and Build Firmware
      run: |
        # 1. 强制将当前工作区下的外部多源目录显式注册给 west 拓扑结构
        west config manifest.path .
        
        # 2. 绕过 Kconfig 严格模式拦截，同时不干扰顶层全局环境变量
        export KCONFIG_WARN_AS_ERROR=0
        west build -b promicro_nrf52840 -- -DCONF_FILE=prj.conf -DKCONFIG_WARN_AS_ERROR=0

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ProMicro_Power_Bridge_UF2
        path: |
          build/zephyr/*.uf2
